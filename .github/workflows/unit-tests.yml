name: Offline source-code checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q serve.py taskbridge.py scripts tests
      - run: python -m unittest discover -s tests -v
# This CI workflow does not run the gated benchmark or use model credentials.
